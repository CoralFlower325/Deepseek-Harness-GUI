name: Bug report
description: Report a reproducible problem in the macOS wrapper
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include API keys, provider credentials, or the contents of `~/.dsh`.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 14.6
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      options:
        - Apple Silicon (arm64)
        - Intel (x86_64, source build)
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Harness runtime version
      placeholder: 0.1.0-rc.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the shortest sequence that reliably shows the problem.
      placeholder: |
        1. Open the app
        2. Choose a workspace
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Include only lines related to the problem and remove personal paths or credentials.
      render: shell
  - type: checkboxes
    id: upstream
    attributes:
      label: Scope confirmation
      options:
        - label: I believe this problem is in the macOS wrapper or packaging, rather than the upstream Harness Web UI.
          required: true
        - label: I removed API keys, credentials, and personal information from this report.
          required: true
