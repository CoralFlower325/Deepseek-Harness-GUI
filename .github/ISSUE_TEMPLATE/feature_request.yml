name: Feature request
description: Suggest an improvement to the macOS wrapper
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful macOS-side change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App window and navigation
        - Workspace management
        - Harness process lifecycle
        - Runtime updates
        - Packaging and distribution
        - Documentation
    validations:
      required: true
